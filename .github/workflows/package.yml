name: Package Android and Windows

on:
  push:
    tags:
      - '**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and export Windows + Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check out the requested tag or ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Cache the pinned Godot editor and export templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.7.stable
          key: godot-4.7-standard-linux-x64-export-v1

      - name: Install Godot 4.7
        run: |
          bash tools/ci/install_godot.sh engine
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project resources
        run: godot --headless --path . --editor --import --quit

      - name: Verify export metadata handling
        run: python3 -m unittest discover -s tests -p 'test_ci_export.py'

      - name: Run gameplay and player art regression suites and persistence checks
        run: |
          mkdir -p builds/logs
          for suite in rope_landing rope_pickups level_route combat projectiles boss feedback weapons save touch_controls player_art; do
            godot --headless --path . --fixed-fps 60 \
              --log-file "builds/logs/$suite.log" --script "res://tests/test_$suite.gd"
          done
          godot --headless --path . --script res://tests/test_profile_persistence.gd -- --write
          godot --headless --path . --script res://tests/test_profile_persistence.gd

      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize Android SDK and install export tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools build-tools;36.1.0 platforms;android-36'

      - name: Install Godot export templates
        run: |
          bash tools/ci/install_godot.sh templates

      - name: Configure signing and build metadata
        id: metadata
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing_args=()
          if [[ -n "$ANDROID_KEYSTORE_BASE64" || -n "$ANDROID_KEY_ALIAS" || -n "$ANDROID_KEY_PASSWORD" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo '::error::Configure all three Android signing secrets, or leave all three unset.'
              exit 1
            fi
            keystore_path="$RUNNER_TEMP/android-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            chmod 600 "$keystore_path"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore_path" >> "$GITHUB_ENV"
            signing_args+=(--signed)
          else
            keystore_path="$RUNNER_TEMP/android-debug.keystore"
            keytool -genkeypair -noprompt -keystore "$keystore_path" \
              -alias androiddebugkey -storepass android -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore_path" >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
          fi
          python3 tools/ci/prepare_export.py "${signing_args[@]}"

      - name: Export Windows and Android
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.build_name }}
          ANDROID_MODE: ${{ steps.metadata.outputs.android_mode }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p builds/windows builds/dist
          godot --headless --path . --export-release 'Windows Desktop' builds/windows/ninja-must-die.exe
          godot --headless --path . "--export-$ANDROID_MODE" Android "builds/dist/$BUILD_NAME-android-$ANDROID_MODE.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify \
            "builds/dist/$BUILD_NAME-android-$ANDROID_MODE.apk"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info = {
              "tag": os.environ["BUILD_TAG"],
              "commit": os.environ["GITHUB_SHA"],
              "godot": "4.7-stable",
              "android_mode": os.environ["ANDROID_MODE"],
              "android_version_code": int(os.environ["GITHUB_RUN_NUMBER"]),
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }
          Path("builds/dist/build-info.json").write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n")
          Path("builds/windows/README.txt").write_text("影刃疾行\n运行 ninja-must-die.exe。\nF3：触屏预览；Esc：暂停。\n", encoding="utf-8")
          PY
          cp builds/dist/build-info.json builds/windows/
          (cd builds/windows && zip -q -r "../dist/$BUILD_NAME-windows-x86_64.zip" .)
          (cd builds/dist && sha256sum ./*.apk ./*.zip build-info.json > SHA256SUMS.txt)
          {
            echo "### Build packages"
            echo "Windows: $BUILD_NAME-windows-x86_64.zip"
            echo "Android: $BUILD_NAME-android-$ANDROID_MODE.apk"
            if [[ "$ANDROID_MODE" == debug ]]; then
              echo 'Android uses a temporary debug key and a separate .preview package ID. Reinstall when switching between workflow runs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: builds/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-logs
          path: builds/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing keys
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-release.keystore" "$RUNNER_TEMP/android-debug.keystore"

  release-assets:
    name: Attach packages to the published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: dist

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
