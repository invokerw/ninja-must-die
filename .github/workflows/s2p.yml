name: S2P offline checks

on:
  pull_request:
    paths:
      - 'tools/art/s2p/**'
      - 'export_presets.cfg'
      - '.github/workflows/s2p.yml'
  push:
    paths:
      - 'tools/art/s2p/**'
      - 'export_presets.cfg'
      - '.github/workflows/s2p.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/art/s2p/engine/package-lock.json
      - run: npm ci --prefix tools/art/s2p/engine --no-audit --no-fund
      - run: node tools/art/s2p/cli.cjs check
