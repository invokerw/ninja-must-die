<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSD 拆分结果</title>
<style>
:root{color-scheme:dark;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:#111821;color:#e8eef7}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:28px 22px}h1{font-size:27px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}p{margin:6px 0}a{color:#9acaff}button,input,select{font:inherit}button,.download{border:1px solid #46556d;background:#24344b;color:#e8eef7;border-radius:8px;padding:8px 15px;cursor:pointer;text-decoration:none}button:hover,.download:hover{background:#334b6c}button[aria-selected=true]{background:#395f92;border-color:#78a6e3}header,.heading,.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted,small{color:#aabbcf}.metrics{display:flex;flex-wrap:wrap;gap:12px 26px;margin:20px 0}.metric strong{display:block;font-size:22px}.metric span{font-size:13px;color:#aabbcf}nav{display:flex;gap:8px;position:sticky;top:0;background:#111821ed;padding:12px 0;z-index:2;border-bottom:1px solid #324057;margin-bottom:20px}article,.card{background:#1b2533;border:1px solid #2c3a4e;border-radius:12px;padding:18px;margin:16px 0}.notice{border-left:3px solid #d8b469;padding:10px 15px;background:#302b23;margin:16px 0}.notice li{margin:7px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:100%}figure{margin:0;min-width:0}figcaption{font-size:13px;color:#aabbcf;margin:7px 0}img{max-width:min(100%,760px);height:auto;display:block}.checker{background-color:#bac1ca;background-image:conic-gradient(#e2e6ec 25%,transparent 0 50%,#e2e6ec 0 75%,transparent 0);background-size:20px 20px;border-radius:4px}.stage-images{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.stage-images figure{flex:1 1 230px;max-width:760px}.stage-images img{max-height:400px;object-fit:contain;object-position:left top}.steps{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}td,th{text-align:left;padding:9px 12px;border-bottom:1px solid #334056}th{color:#aabbcf}details summary{cursor:pointer;padding:7px 0}.layer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;align-items:start;margin:12px 0}.layer-grid canvas{display:block;max-width:100%;height:auto;object-fit:contain}.layer-grid .image-frame{min-height:40px;display:flex;justify-content:center;align-items:flex-start}.toolbar{justify-content:flex-start;margin:16px 0}input,select{background:#17212f;border:1px solid #46556d;border-radius:7px;padding:8px 10px;color:inherit}input{width:min(360px,100%)}[hidden]{display:none!important}.error{color:#ffbaac}.status{color:#bfdbff}.layer-meta{font-size:12px;color:#aabbcf;overflow-wrap:anywhere}.more{margin:15px 0}.native{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}.empty{padding:24px;color:#aabbcf}@media(max-width:650px){body{padding:18px 12px}.pair{grid-template-columns:1fr}.layer-grid{grid-template-columns:repeat(2,1fr)}nav button{padding:8px 11px}.metrics{gap:12px 22px}}
</style>
<style>
.blend-controls{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 16px;flex-wrap:wrap}.blend-controls label,.blend-controls span,.blend-controls output{white-space:nowrap}.blend-controls input[type=range]{flex:1;width:auto;min-width:100px;padding:0;accent-color:#8bbcff;cursor:ew-resize}.blend-controls output{min-width:3em;font-variant-numeric:tabular-nums}.blend-frame{position:relative;max-width:760px;margin:auto;overflow:hidden}.blend-frame #original-image{width:100%;max-width:none;height:auto}.blend-frame #final-image{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:.5;pointer-events:none}.blend-links{max-width:760px;margin:12px auto 0;font-size:13px}
</style>
<header><div><h1>PSD 拆分结果</h1><p class="muted" id="status">正在读取任务…</p></div><a id="download" class="download" hidden>下载 PSD</a></header>
<div id="metrics" class="metrics"></div>
<nav role="tablist" aria-label="结果内容">
  <button role="tab" id="tab-overview" aria-controls="overview" aria-selected="true">整图对照</button>
  <button role="tab" id="tab-process" aria-controls="process" aria-selected="false">拆分过程</button>
  <button role="tab" id="tab-layers" aria-controls="layers" aria-selected="false">图层检查</button>
</nav>
<section id="overview" role="tabpanel" aria-labelledby="tab-overview">
  <div id="findings"></div>
  <div class="card">
    <div class="blend-controls"><label for="blend">原图 0</label><input id="blend" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="原图与合成图混合比例" disabled><span>合成图 1</span><output id="blend-value" for="blend" aria-live="off">0.50</output></div>
    <div class="blend-frame checker"><img id="original-image" src="input.png" alt="原始截图"><img id="final-image" alt="完成后的图层合成，与原图在同一位置叠加" hidden></div>
    <p id="final-pending" class="muted">完成后可拖动滑块叠加对照</p>
    <p class="blend-links"><a href="input.png">查看原图</a> · <a id="final-link" hidden>查看合成图</a></p>
  </div>
  <p id="verification" class="muted"></p>
</section>
<section id="process" role="tabpanel" aria-labelledby="tab-process" hidden><h2>步骤与时间</h2><div class="steps card"><table><thead><tr><th>步骤</th><th>状态</th><th>开始时间</th><th>已运行 / 总耗时</th><th>结束时间</th></tr></thead><tbody id="steps"></tbody></table></div><div id="loops"></div></section>
<section id="layers" role="tabpanel" aria-labelledby="tab-layers" hidden><h2>原图 → 原始模型返回 → 放回图层 → 最终合成</h2><p class="muted">缩略图保持比例且不放大；点击下方链接可查看原生图片。</p><div class="toolbar"><input id="search" type="search" aria-label="搜索图层" placeholder="搜索图层名称"><select id="category" aria-label="图层类别"><option value="">全部类别</option></select><span id="layer-count" class="muted"></span></div><div id="layer-list"></div><button id="more" class="more" hidden>显示更多图层</button></section>
<script>
'use strict';
const RUN_ROOT=__RUN_ROOT_JSON__;
const $=id=>document.getElementById(id);
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={completed:'已完成',running:'运行中',failed:'失败',passed:'通过',needs_review:'有待处理的问题',not_reviewed:'尚未检查',not_checked:'尚未检查',pending:'等待中',queued:'排队中',text:'文字',icon:'图标',artwork:'插画',panel:'面板',decoration:'装饰',surface:'底板',background:'背景'};
const label=value=>labels[value]||value||'—';
const time=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'—';
const duration=ms=>{const seconds=Math.max(0,Math.floor(ms/1000));return `${Math.floor(seconds/60)} 分 ${seconds%60} 秒`;};
function applyBlend(){const value=Number($('blend').value);$('final-image').style.opacity=String(value);$('blend-value').value=value.toFixed(2);}
$('blend').addEventListener('input',applyBlend);
$('final-image').addEventListener('load',()=>{$('blend').disabled=false;applyBlend();});
applyBlend();
function asset(file){
  if(!file)return '';
  const normalized=String(file).replace(/\\/g,'/');
  if(!/^(?:[a-z]:\/|\/)/i.test(normalized))return normalized.split('/').map(encodeURIComponent).join('/');
  const root=RUN_ROOT.replace(/\\/g,'/').replace(/\/$/,'').split('/'), target=normalized.split('/');
  let common=0;while(common<root.length&&common<target.length&&root[common].toLowerCase()===target[common].toLowerCase())common++;
  return [...root.slice(common).map(()=>'..'),...target.slice(common)].map(encodeURIComponent).join('/');
}
async function json(file,optional=false){const response=await fetch(file,{cache:'no-store'});if(!response.ok){if(optional&&response.status===404)return null;throw Error(`读取 ${file} 失败（${response.status}）`);}return response.json();}
let state=null, layers=[], findings=null, selectedTab='overview', visibleCount=12, layerVersion='', loopVersion='', findingsVersion='';
function selectTab(id){if(!['overview','process','layers'].includes(id))id='overview';selectedTab=id;for(const name of ['overview','process','layers']){$(name).hidden=name!==id;$('tab-'+name).setAttribute('aria-selected',String(name===id));}history.replaceState(null,'','#'+id);if(id==='layers')renderLayers();}
document.querySelectorAll('[role=tab]').forEach(button=>button.addEventListener('click',()=>selectTab(button.getAttribute('aria-controls'))));
document.querySelector('[role=tablist]').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;const tabs=[...document.querySelectorAll('[role=tab]')];let index=tabs.indexOf(document.activeElement);index=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;event.preventDefault();tabs[index].click();tabs[index].focus();});
function renderTiming(){if(!state)return;
  const end=state.ended_at?Date.parse(state.ended_at):Date.now(),elapsed=state.started_at?duration(end-Date.parse(state.started_at)):'—';
  $('metrics').innerHTML=[['转换耗时',elapsed],['图层',state.layer_count??layers.length??'—'],['非文字轮次',Math.max(0,(state.loops||[]).length-1)],['画布',(state.canvas||[]).join(' × ')||'—']].map(([name,value])=>`<div class="metric"><strong>${escape(value)}</strong><span>${name}</span></div>`).join('');
  $('steps').innerHTML=(state.steps||[]).map(step=>`<tr><td>${escape(step.title)}</td><td class="${step.status==='failed'?'error':'status'}">${escape(label(step.status))}</td><td>${time(step.started_at)}</td><td>${step.started_at?duration((step.ended_at?Date.parse(step.ended_at):Date.now())-Date.parse(step.started_at)):'—'}</td><td>${time(step.ended_at)}</td></tr>`).join('');
}
function figure(file,title){return file?`<figure><figcaption>${escape(title)}</figcaption><a href="${escape(asset(file))}"><img class="checker" loading="lazy" src="${escape(asset(file))}" alt="${escape(title)}"></a></figure>`:'';}
function renderLoops(){
  const version=JSON.stringify((state.loops||[]).map(loop=>[loop.index,loop.report,loop.after,loop.layers?.length]));if(version===loopVersion)return;loopVersion=version;
  $('loops').innerHTML=(state.loops||[]).map(loop=>`<article><details ${loop.index===1?'open':''}><summary><strong>${loop.index===1?'文字轮':'非文字第 '+(loop.index-1)+' 轮'}</strong> · ${(loop.selected||[]).length} 个目标</summary><div class="stage-images">${figure(loop.input_checker||loop.input,'本轮输入')}${figure(loop.bbox_preview_checker||loop.bbox_preview,'本轮目标 bbox')}${figure(loop.after_checker||loop.after,'删除目标后')}${figure(loop.recomposed_checker||loop.recomposed,'本轮放回效果')}</div></details></article>`).join('');
}
const imageCache=new Map();
function loadImage(file){const url=asset(file);if(!imageCache.has(url)){const promise=new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>{imageCache.delete(url);reject(Error('图片读取失败'));};image.src=url;});imageCache.set(url,promise);}return imageCache.get(url);}
async function cropPreview(canvas,file,rect){
  if(!file){canvas.replaceWith(document.createTextNode('无独立模型图'));return;}
  try{const image=await loadImage(file);if(!canvas.isConnected)return;
    const [x,y,w,h]=rect||[0,0,image.naturalWidth,image.naturalHeight];
    const scale=Math.min(1,170/w,190/h);canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
    canvas.getContext('2d').drawImage(image,x,y,w,h,0,0,canvas.width,canvas.height);canvas.dataset.loaded='true';
  }catch(error){if(canvas.isConnected){const note=document.createElement('span');note.className='error';note.textContent=error.message;canvas.replaceWith(note);}}
}
function renderLayers(force=false){
  if(selectedTab!=='layers')return;
  const query=$('search').value.trim().toLowerCase(),category=$('category').value;
  const filtered=layers.filter(layer=>(!category||layer.category===category)&&(!query||[layer.id,layer.name,layer.description].join(' ').toLowerCase().includes(query)));
  const version=JSON.stringify([query,category,visibleCount,layers.length,state?.recomposed]);if(!force&&version===layerVersion)return;layerVersion=version;
  $('layer-count').textContent=`${filtered.length} 层`;$('more').hidden=filtered.length<=visibleCount;
  $('layer-list').innerHTML=filtered.slice(0,visibleCount).map((layer,i)=>`<article><h3>${escape(layer.name||layer.id)}</h3><p class="layer-meta">${escape(label(layer.category))} · bbox ${escape(JSON.stringify(layer.bbox))}</p><div class="layer-grid">${['原图','原始模型返回','放回图层','最终合成'].map((title,column)=>`<figure><figcaption>${title}</figcaption><div class="image-frame checker"><canvas data-row="${i}" data-column="${column}" aria-label="${title}"></canvas></div></figure>`).join('')}</div><div class="native">${layer.model_generated_source?`<a href="${escape(asset(layer.model_generated_source))}">原始模型整图</a>`:''}<a href="${escape(asset(layer.source))}">原生图层 PNG</a></div></article>`).join('')||'<p class="empty">暂无匹配图层</p>';
  const final=state?.recomposed;
  $('layer-list').querySelectorAll('canvas').forEach(canvas=>{const layer=filtered[Number(canvas.dataset.row)],column=Number(canvas.dataset.column),bbox=layer.bbox;
    const file=[`${RUN_ROOT}/input.png`,layer.model_generated_source||layer.model_rgba_source||layer.source,layer.source,final][column];
    const rect=column===0||column===3?bbox:column===1&&layer.model_generated_source?(layer.atlas_cell?.model_rect||layer.model_rect):null;
    cropPreview(canvas,file,rect);
  });
}
for(const name of ['search','category'])$(name).addEventListener(name==='search'?'input':'change',()=>{visibleCount=12;renderLayers();});
$('more').addEventListener('click',()=>{visibleCount+=12;renderLayers();});
async function refresh(){
  try{
    state=await json('status.json');
    const optional=await Promise.allSettled([json('layers.json',true),json('verification.json',true),json('inspection/visual_review.json',true)]);
    const value=i=>optional[i].status==='fulfilled'?optional[i].value:null;
    const nextLayers=value(0);if(nextLayers){layers=nextLayers.map(layer=>({...layer,category:layer.category||layer.kind,model_generated_source:layer.model_generated_source||(layer.id==='background_final'?`${RUN_ROOT}/background_model.png`:null)}));const current=$('category').value;const categories=[...new Set(layers.map(layer=>layer.category).filter(Boolean))];$('category').innerHTML='<option value="">全部类别</option>'+categories.map(category=>`<option value="${escape(category)}">${escape(label(category))}</option>`).join('');$('category').value=current;}
    const verification=value(1);findings=value(2)||state.visual_review;
    $('status').textContent=`${label(state.status)}${state.started_at?' · 开始于 '+time(state.started_at):''}${state.ended_at?' · 结束于 '+time(state.ended_at):''}`;
    const list=findings?.findings||[],nextFindingsVersion=JSON.stringify(list);if(nextFindingsVersion!==findingsVersion){findingsVersion=nextFindingsVersion;$('findings').innerHTML=list.length?`<div class="notice"><strong>检查发现 ${list.length} 项差异</strong><details><summary>查看检查结果</summary><ul>${list.map(item=>`<li>${escape(typeof item==='string'?item:item.finding||item.description||item.target)}</li>`).join('')}</ul></details></div>`:'';}
    if(state.psd){$('download').href=asset(state.psd);$('download').hidden=false;}
    if(state.recomposed){const source=asset(state.recomposed);if($('final-image').getAttribute('src')!==source)$('final-image').src=source;$('final-image').hidden=false;$('final-link').href=source;$('final-link').hidden=false;$('final-pending').hidden=true;}
    $('verification').textContent=`PSD 结构检查：${label(verification?.status)}。${list.length?'视觉检查仍有上述差异。':state.status==='completed'?'视觉检查：'+label(findings?.status)+ '。':''}图层为可移动的栅格图层。`;
    renderTiming();renderLoops();renderLayers();
  }catch(error){$('status').textContent=state?error.message:'正在等待任务记录…';}
  setTimeout(refresh,state?.status==='completed'?15000:5000);
}
selectTab(location.hash.slice(1));setInterval(renderTiming,1000);refresh();
</script>
</html>
